name: Build SCGlass.exe
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover tests
      - run: python -m pip install pyinstaller
      - run: python -m PyInstaller --noconfirm --onefile --console --name SCGlass --add-data "web;web" sc_glass.py
      - uses: actions/upload-artifact@v4
        with:
          name: SCGlass
          path: dist/SCGlass.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/SCGlass.exe
