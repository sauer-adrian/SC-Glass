<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pair SC Glass</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono:wght@400;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root { color-scheme: dark; --deck:#121618; --plate:#1d2327; --engrave:#8a969e; --ink:#c9d2d7; --lit:#f3f6f7; --ice:#9fd8ff; --amber:#ffb627; --font:"B612","Segoe UI",system-ui,sans-serif; --mono:"B612 Mono",Consolas,monospace; }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--deck); color:var(--ink); font:15px/1.5 var(--font); padding:24px; box-sizing:border-box; }
.card { width:min(760px,100%); display:grid; grid-template-columns:auto 1fr; gap:32px; align-items:center; background:linear-gradient(#20272b,var(--plate)); border-radius:12px; padding:32px; box-shadow:0 0 0 1px #000, inset 0 1px 0 #2b3339, 0 20px 50px rgba(0,0,0,.5); }
@media (max-width:640px) { .card { grid-template-columns:1fr; justify-items:center; text-align:center; } }
#qr { background:#fff; padding:14px; border-radius:8px; line-height:0; }
#qr img, #qr canvas { width:240px; height:240px; image-rendering:pixelated; }
h1 { margin:0 0 6px; color:var(--lit); font-size:22px; }
p { margin:8px 0; max-width:52ch; }
.pin { font:700 40px/1 var(--mono); letter-spacing:.18em; color:var(--ice); margin:14px 0 4px; }
.lbl { font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--engrave); margin-top:18px; }
.url { font:14px var(--mono); color:var(--lit); overflow-wrap:anywhere; }
.note { color:var(--engrave); font-size:13.5px; }
.warn { color:var(--amber); }
</style>
</head>
<body>
<div class="card">
  <div id="qr" aria-label="QR code for the deck address"></div>
  <div>
    <h1>Scan with your tablet or phone</h1>
    <p>The camera opens the deck and pairs it in one step. Your device must be on the same Wi-Fi as this PC.</p>
    <div class="lbl">Or type this address</div>
    <div class="url" id="urls">…</div>
    <div class="lbl">Pairing PIN</div>
    <div class="pin" id="pin">······</div>
    <p class="note" id="am"></p>
    <p class="note" id="gl"></p>
    <p class="note">If the deck doesn't load, allow SC Glass (or Python) through Windows Firewall on private networks, then try again.</p>
  </div>
</div>
<script>
fetch("/api/pair").then(r => r.json()).then(d => {
  const urls = d.ips.map(ip => `http://${ip}:${d.port}`);
  document.getElementById("urls").innerHTML = urls.map(u => `<div>${u}</div>`).join("");
  document.getElementById("pin").textContent = d.pin;
  const am = d.actionmaps;
  document.getElementById("am").textContent = am.error
    ? `${am.error}. The deck will use Star Citizen's default keys until it finds your profile.`
    : `Using your Star Citizen keybinds: ${am.count} changes found.`;
  document.getElementById("gl").textContent = d.gamelog
    ? "Reading Star Citizen's Game.log: the deck follows the ship you board."
    : "Game.log not found yet. It appears after Star Citizen has run once; ship detection starts then.";
  const target = `${urls[0]}/#pin=${d.pin}`;
  if (window.QRCode) new QRCode(document.getElementById("qr"), { text: target, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.M });
  else document.getElementById("qr").innerHTML = '<p class="warn" style="color:#000;line-height:1.4;width:220px">QR code needs internet on this PC. Type the address instead.</p>';
}).catch(() => { document.getElementById("urls").textContent = "Open this page on the PC running SC Glass."; });
</script>
</body>
</html>
